```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Simulator - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #203a43;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #176b87;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #104e64;
        }

        .message {
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            background: #ffe5e5;
            color: #a00000;
        }

        .demo {
            background: #eaf6ff;
            padding: 12px;
            border-radius: 7px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>ATM Simulator</h1>
        <p class="subtitle">Welcome! Please log in to continue.</p>

        <form method="POST" action="/">
            <label for="account">Account Number</label>
            <input
                type="text"
                id="account"
                name="account"
                placeholder="Enter account number"
                required
            >

            <label for="pin">ATM PIN</label>
            <input
                type="password"
                id="pin"
                name="pin"
                placeholder="Enter 4-digit PIN"
                inputmode="numeric"
                maxlength="4"
                required
            >

            <button type="submit">Login</button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <div class="demo">
            <strong>Demo Login Details</strong><br>
            Account Number: 1234567890<br>
            PIN: 1234
        </div>
    </div>
</body>
</html>
```
